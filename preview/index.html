;opacity:.55}input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3)}input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}::selection{background:var(--lapis);color:#fff}.app-shell{min-height:100dvh;display:flex;flex-direction:column}.app-header{position:sticky;top:0;z-index:20;height:var(--header-height);display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:0 var(--space-4);background:var(--surface);border-bottom:1px solid var(--border)}.app-header .brand{display:flex;align-items:center;gap:var(--space-2);font-weight:700;font-size:var(--fs-lg)}.app-header .brand .logo-dot{width:14px;height:14px;border-radius:50%;background:var(--saffron);box-shadow:0 0 0 3px var(--lapis)}.app-main{flex:1;width:100%;max-width:var(--content-max);margin:0 auto;padding:var(--space-4) var(--space-4) calc(var(--nav-height) + var(--space-5))}.bottom-nav{position:fixed;bottom:0;inset-inline:0;z-index:20;height:var(--nav-height);display:flex;justify-content:space-around;align-items:stretch;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-sm);color:var(--text-3)}.bottom-nav a .nav-icon{font-size:1.3rem;line-height:1}.bottom-nav a.active{color:var(--saffron);font-weight:700}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-4);box-shadow:var(--shadow)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);font-weight:500;border:1px solid var(--border);background:var(--surface-2);color:var(--text);transition:background .15s,border-color .15s}.btn:hover:not(:disabled){background:var(--surface-3)}.btn-primary{background:var(--saffron);border-color:var(--saffron);color:var(--on-saffron);font-weight:700}.btn-primary:hover:not(:disabled){background:var(--saffron-hover);border-color:var(--saffron-hover)}.btn-lg{padding:var(--space-3) var(--space-5);font-size:var(--fs-lg);border-radius:var(--radius)}.chip{display:inline-flex;align-items:center;gap:var(--space-1);padding:2px var(--space-3);border-radius:999px;font-size:var(--fs-sm);background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}.chip.active{background:var(--lapis);border-color:var(--lapis);color:#fff}.muted{color:var(--text-2)}.small{font-size:var(--fs-sm)}.page-title{font-size:var(--fs-xl);margin-bottom:var(--space-4)}.stack{display:flex;flex-direction:column;gap:var(--space-4)}.row{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}.spread{justify-content:space-between}.grow{flex:1}.question-view .question-stem{font-size:var(--fs-lg);margin:var(--space-3) 0 var(--space-4);line-height:1.9}.options{display:flex;flex-direction:column;gap:var(--space-3)}.option{display:flex;align-items:center;gap:var(--space-3);width:100%;text-align:start;padding:var(--space-3) var(--space-4);border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface-2);transition:border-color .15s,background .15s}.option:hover:not(:disabled){border-color:var(--lapis)}.option-label{flex-shrink:0;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--surface-3);font-weight:700;font-size:var(--fs-sm)}.option-text{flex:1}.option-mark{flex-shrink:0;font-weight:700;font-size:var(--fs-lg)}.option-selected{border-color:var(--lapis);background:var(--surface-3)}.option-correct{border-color:var(--correct);background:var(--correct-bg)}.option-correct .option-label,.option-correct .option-mark{color:var(--correct)}.option-wrong{border-color:var(--wrong);background:var(--wrong-bg)}.option-wrong .option-label,.option-wrong .option-mark{color:var(--wrong)}.explanations{margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px dashed var(--border);display:flex;flex-direction:column;gap:var(--space-2)}.explanation{margin:0;font-size:var(--fs-sm);color:var(--text-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);border-inline-start:3px solid var(--border);background:var(--surface-2)}.explanation.is-correct{border-inline-start-color:var(--correct);color:var(--text)}.study-hint{margin:var(--space-2) 0 0;font-size:var(--fs-sm);color:var(--saffron);font-weight:500}.filter-bar{display:flex;flex-wrap:wrap;gap:var(--space-2)}.filter-group{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}.chip-btn{cursor:pointer}.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:var(--space-2)}.q-grid-cell{aspect-ratio:1;display:grid;place-items:center;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);font-size:var(--fs-sm);font-weight:500}.q-grid-cell.answered{background:var(--lapis);border-color:var(--lapis);color:#fff}.q-grid-cell.flagged{border-color:var(--flag);box-shadow:inset 0 0 0 2px var(--flag)}.q-grid-cell.current{outline:2px solid var(--saffron);outline-offset:1px}.exam-timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:var(--fs-lg);padding:var(--space-1) var(--space-3);border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border)}.exam-timer.warning{color:var(--wrong);border-color:var(--wrong)}.bar-row{display:grid;grid-template-columns:5.5rem 1fr 3rem;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2)}.bar-track{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}.bar-fill{height:100%;border-radius:999px;transition:width .4s}.stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:var(--space-3)}.stat-tile{text-align:center;padding:var(--space-3);border-radius:var(--radius);background:var(--surface-2);border:1px solid var(--border)}.stat-tile .stat-value{font-size:var(--fs-2xl);font-weight:700;line-height:1.2}.stat-tile .stat-label{font-size:var(--fs-sm);color:var(--text-2)}.select-card{cursor:pointer;border:1.5px solid var(--border);transition:border-color .15s,background .15s}.select-card:hover{border-color:var(--lapis)}.select-card.selected{border-color:var(--saffron);background:var(--surface-2)}.empty-state{text-align:center;padding:var(--space-6) var(--space-4);color:var(--text-2)}.empty-state .emoji{font-size:2.5rem;display:block;margin-bottom:var(--space-3)}</style>
